openapi: 3.1.0
info:
  title: Pet API
  version: '1.0'
paths:
  /pets:
    get:
      summary: List pets
      responses:
        '200':
          description: OK
components:
  # `components.mediaTypes` is a 3.2 addition; a 3.1 document has no such
  # section, so its use here is a spec violation.
  mediaTypes:
    PetJson:
      schema:
        type: object
        properties:
          id:
            type: integer
