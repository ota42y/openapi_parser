openapi: 3.2.0
info:
  title: Pet API
  version: '1.0'
paths:
  /pets:
    get:
      summary: List pets
      responses:
        '200':
          description: OK
          content:
            application/json:
              $ref: '#/components/mediaTypes/PetJson'
    post:
      summary: Create a pet
      requestBody:
        content:
          application/json:
            $ref: '#/components/mediaTypes/PetJson'
      responses:
        '201':
          description: Created
components:
  # `components.mediaTypes` is legitimate under 3.2, so no violation is
  # expected here.
  mediaTypes:
    PetJson:
      schema:
        type: object
        properties:
          id:
            type: integer
