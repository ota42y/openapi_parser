openapi: 3.2.0
info:
  title: Pet API
  version: '1.0'
paths:
  /pets:
    # the `query` operation is legitimate under 3.2, so no violation is
    # expected here.
    query:
      summary: Query pets
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nameStartsWith:
                  type: string
      responses:
        '200':
          description: OK
