    post:
      requestBody:
        content:
          application/json:
            $ref: '#/components/mediaTypes/PetJson'
      responses:
        '201':
          description: Created
components:
  mediaTypes:
    PetJson:
      schema:
        type: object
        properties:
          id:
            type: integer
