openapi: 3.1.0
info:
  title: Pet API
  version: '1.0'
paths:
  /pets:
    get:
      summary: List pets
      parameters:
        # `in: querystring` is a 3.2 Parameter location; a 3.1 document has
        # no such location, so its use here is a spec violation.
        - name: q
          in: querystring
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
      responses:
        '200':
          description: OK
