openapi: 3.2.0
info:
  title: Pet API
  version: '1.0'
paths:
  /pets:
    get:
      summary: List pets
      responses:
        '200':
          description: OK
components:
  schemas:
    Pet:
      type: object
      properties:
        id:
          type: integer
      xml:
        name: pet
        # `nodeType` is a legitimate XML Object field under 3.2, so no
        # violation is expected here.
        nodeType: element
