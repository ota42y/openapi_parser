openapi: 3.1.0
info:
  title: Pet API
  version: '1.0'
# `name` on a Server Object is a 3.2 addition; a 3.1 document has no such
# field, so its use here is a spec violation.
servers:
  - url: https://api.example.com
    name: production
paths:
  /pets:
    get:
      summary: List pets
      responses:
        '200':
          description: OK
