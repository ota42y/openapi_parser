openapi: 3.1.0
info:
  title: Pet API
  version: '1.0'
paths:
  /pets:
    get:
      summary: List pets
      responses:
        '200':
          description: OK
components:
  schemas:
    Pet:
      type: object
      properties:
        id:
          type: integer
      xml:
        name: pet
        # `nodeType` on an XML Object is a 3.2 addition; a 3.1 document has
        # no such field, so its use here is a spec violation.
        nodeType: element
