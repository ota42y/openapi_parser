openapi: 3.0.3
info:
  title: Tree API
  version: '1.0'
paths:
  /trees:
    get:
      summary: Fetch a tree
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
components:
  schemas:
    Node:
      type: object
      # `$dynamicAnchor` is a JSON Schema 2020-12 dynamic resolution point
      # adopted by 3.1; 3.0 has no equivalent, so this is a spec violation.
      $dynamicAnchor: node
      properties:
        label:
          type: string
