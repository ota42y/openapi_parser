openapi: 3.0.3
info:
  title: Geo API
  version: '1.0'
paths:
  /points:
    post:
      summary: Submit a coordinate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Coordinate'
      responses:
        '201':
          description: Created
components:
  schemas:
    Coordinate:
      # `prefixItems` is JSON Schema 2020-12's positional tuple keyword,
      # adopted by 3.1. 3.0 has no equivalent, so this is a spec violation.
      type: array
      prefixItems:
        - type: number
        - type: number
