openapi: 3.1.0
info:
  title: Telemetry API
  version: '1.0'
paths:
  /readings:
    get:
      summary: List sensor readings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reading'
components:
  schemas:
    Reading:
      type: object
      properties:
        # 3.1 allows `type` to be an Array of primitive names, so this is
        # legitimate on a 3.1 document and no violation is expected.
        label:
          type: [string, "null"]
