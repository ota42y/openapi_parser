openapi: 3.1.0
info:
  title: Pet API
  version: '1.0'
paths:
  /pets/{id}:
    get:
      summary: Fetch a pet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Pet/$defs/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Pet/$defs/Id'
      # `$defs` is legitimate under 3.1 (JSON Schema 2020-12), so no violation
      # is expected here.
      $defs:
        Id:
          type: integer
