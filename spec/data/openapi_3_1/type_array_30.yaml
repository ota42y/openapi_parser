openapi: 3.0.3
info:
  title: Telemetry API
  version: '1.0'
paths:
  /readings:
    get:
      summary: List sensor readings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reading'
components:
  schemas:
    Reading:
      type: object
      properties:
        # 3.1 form: `type` as an Array of primitive names. 3.0 only allows a
        # single type String, so the array form is a spec violation here.
        label:
          type: [string, "null"]
