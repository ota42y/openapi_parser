openapi: 3.0.3
info:
  title: Tree API
  version: '1.0'
paths:
  /trees:
    get:
      summary: Fetch a tree
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
components:
  schemas:
    Node:
      type: object
      properties:
        children:
          type: array
          # `$dynamicRef` is a JSON Schema 2020-12 dynamic referencing keyword
          # adopted by 3.1; 3.0 only knows `$ref`, so this is a spec violation.
          items:
            $dynamicRef: '#node'
