openapi: 3.0.3
info:
  title: Pet API
  version: '1.0'
paths:
  /pets/{id}:
    get:
      summary: Fetch a pet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Pet/$defs/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Pet/$defs/Id'
      # `$defs` is a JSON Schema 2020-12 keyword adopted by 3.1; 3.0 Schema
      # Objects do not define it, so this is a spec violation.
      $defs:
        Id:
          type: integer
