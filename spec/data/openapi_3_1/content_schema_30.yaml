openapi: 3.0.3
info:
  title: Document Upload API
  version: '1.0'
paths:
  /documents:
    post:
      summary: Upload a document
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Attachment'
      responses:
        '201':
          description: Created
components:
  schemas:
    Attachment:
      type: string
      # `contentSchema` is a JSON Schema 2020-12 annotation adopted by 3.1;
      # 3.0 has no equivalent, so its use on a 3.0 document is a spec
      # violation.
      contentSchema:
        type: object
        properties:
          name:
            type: string
