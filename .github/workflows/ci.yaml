name: ci
on:
  - pull_request
  - push
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ruby:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
          - "4.1"
          - ruby-head
        include:
          # macOS runners are capacity-constrained; only test the oldest and newest stable Rubies there.
          - os: macos-latest
            ruby: "3.2"
          - os: macos-latest
            ruby: "4.1"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - run: bundle exec rake
